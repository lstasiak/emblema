[project]
name = "emblema"
version = "0.1.0"
description = "Label-efficient representation learning on heterogeneous sensor streams: a variable-channel, permutation-invariant encoder pretrained without labels, measured honestly."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Lukasz Stasiak" }]
# Lower bound = Python of the free GPU platforms the package is installed on (Kaggle and Colab
# ship 3.12). Local development uses 3.14 (see .python-version); code must stay 3.12-compatible.
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[project.optional-dependencies]
# ML runtime. Domain and application layers never import these.
ml = [
    "numpy>=2.2",
    "torch>=2.9",
    "onnxruntime>=1.22",
]

[project.urls]
Repository = "https://github.com/lstasiak/emblema"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.12",
    "mypy>=1.16",
    "ty>=0.0.1a1",
    "import-linter>=2.0",
    "pre-commit>=4.0",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
default-groups = ["dev"]
# The lock must provide wheels for every target platform, so a missing wheel fails here, not at
# deploy time: Linux arm64 (local containers on M1), Linux x86_64 (CI, GPU platforms), macOS arm64
# (native ML worker).
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# CPU-only PyTorch index: inference targets CPU, and CI and local environments never need CUDA.
# GPU platforms (Kaggle/Colab) use their preinstalled CUDA torch; pip ignores this section there.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

# ---------------------------------------------------------------------------
# ruff (replaces isort entirely: rule set I sorts imports)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade (bounded by target-version = py312)
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PT",       # pytest style
    "RUF",      # ruff-specific
    "TID",      # tidy imports
    "D",        # pydocstyle: Google style where a docstring exists
]
# Docstrings are required only where they add information; their presence is a review decision,
# their style is not.
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["emblema"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: the authority in CI. Strict for domain and application layers.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/emblema", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Adapters, entrypoints and tests talk to third-party code: relax the strictest checks there.
module = [
    "emblema.*.adapters.*",
    "emblema.entrypoints.*",
    "tests.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# ty: fast checker for the development loop (pre-commit)
# ---------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.12"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs external services (Docker, network); skipped by default, run in CI jobs that provide them",
    "ml: needs the 'ml' extra (torch, onnxruntime)",
]

# ---------------------------------------------------------------------------
# coverage: measured by pytest-cov in CI (`pytest --cov`), gate on the total
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["emblema"]
branch = true
# Paths stored relative to the repository root, so the data file is readable outside the job.
relative_files = true

[tool.coverage.report]
fail_under = 92
show_missing = true
skip_empty = true
# Lines that cannot run under test or carry no behaviour: typing-only imports, Protocol and
# abstract method bodies, overload stubs, script guards.
exclude_also = [
    'if TYPE_CHECKING:',
    '^\s*\.\.\.$',
    '@(abc\.)?abstractmethod',
    '@(typing\.)?overload',
    'raise NotImplementedError',
    'if __name__ == .__main__.:',
]

# ---------------------------------------------------------------------------
# import-linter: architecture rules. Checked in CI per contract id and by tests/architecture,
# which also proves that each contract breaks on a deliberate violation.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["emblema"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "context-independence"
name = "Bounded contexts import only each other's published contracts"
type = "independence"
modules = ["emblema.catalog", "emblema.pretraining", "emblema.evaluation", "emblema.serving"]
ignore_imports = [
    "emblema.** -> emblema.*.contracts",
    "emblema.** -> emblema.*.contracts.**",
]
# No context publishes a contracts package yet; the warning disappears with the first one.
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
id = "hexagonal-layers"
name = "Inside a context dependencies point inwards: adapters -> application -> domain"
type = "layers"
containers = ["emblema.catalog", "emblema.pretraining", "emblema.evaluation", "emblema.serving"]
# Parentheses mark a layer as optional: each context grows its layers with its first feature.
layers = ["(adapters)", "(application)", "(domain)"]

[[tool.importlinter.contracts]]
id = "shared-layers"
name = "Inside shared, dependencies point inwards: adapters -> ports -> kernel"
type = "layers"
containers = ["emblema.shared"]
layers = ["(adapters)", "(ports)", "kernel"]

[[tool.importlinter.contracts]]
id = "pure-core"
name = "Domain, application, contracts and shared code import no framework"
type = "forbidden"
# Only the framework-free parts of `emblema.shared`; `emblema.shared.adapters` may use frameworks.
# Add `emblema.shared.events` here when it appears: a source module must exist to be listed.
source_modules = [
    "emblema.shared.kernel", "emblema.shared.ports",
    "emblema.*.domain", "emblema.*.application", "emblema.*.contracts",
]
forbidden_modules = [
    "torch", "numpy", "onnx", "onnxruntime",
    "sqlalchemy", "alembic",
    "fastapi", "starlette", "pydantic", "pydantic_settings",
    "celery", "redis", "mlflow", "boto3", "botocore",
]

[[tool.importlinter.contracts]]
id = "config-only-at-the-edges"
name = "Configuration is read by adapters and entrypoints only"
type = "forbidden"
source_modules = [
    "emblema.shared.kernel", "emblema.shared.ports",
    "emblema.*.domain", "emblema.*.application", "emblema.*.contracts",
]
forbidden_modules = ["emblema.config"]

[[tool.importlinter.contracts]]
id = "contracts-depend-only-on-shared"
name = "Published contracts depend on shared code only"
type = "forbidden"
source_modules = ["emblema.*.contracts"]
forbidden_modules = ["emblema.*.domain", "emblema.*.application", "emblema.*.adapters", "emblema.entrypoints"]

[[tool.importlinter.contracts]]
id = "shared-imports-no-context"
name = "Shared code knows no bounded context"
type = "forbidden"
source_modules = ["emblema.shared"]
forbidden_modules = [
    "emblema.catalog", "emblema.pretraining", "emblema.evaluation", "emblema.serving",
    "emblema.config", "emblema.entrypoints",
]

[[tool.importlinter.contracts]]
id = "entrypoints-are-outermost"
name = "Nothing imports the entrypoints"
type = "forbidden"
source_modules = [
    "emblema.shared", "emblema.config",
    "emblema.catalog", "emblema.pretraining", "emblema.evaluation", "emblema.serving",
]
forbidden_modules = ["emblema.entrypoints"]
