[project]
name = "emblema"
version = "0.1.0"
description = "Label-efficient representation learning on heterogeneous sensor streams: a variable-channel, permutation-invariant encoder pretrained without labels, measured honestly."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Lukasz Stasiak" }]
# Lower bound = Python of the free GPU platforms the package is installed on (Kaggle and Colab
# ship 3.12). Local development uses 3.14 (see .python-version); code must stay 3.12-compatible.
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.13",
    "boto3>=1.43",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
ml = [
    "numpy>=2.2",
    "torch>=2.9",
    "onnxruntime>=1.22",
    # The exporter path through torch.export needs both; onnx also reads the graph back for the
    # export tests.
    "onnx>=1.22",
    "onnxscript>=0.7",
]

# Tracking is its own extra: only a process that trains logs runs, and MLflow's client pulls in
# a stack the API and the inference worker have no use for.
tracking = ["mlflow-skinny>=3.1"]

# Reading the raw corpora whose publisher ships pandas pickles (the satellite telemetry). Its own
# extra: only the process that publishes a corpus reads raw files, and a run or a server never does.
corpora = ["pandas>=2.2"]

[project.urls]
Repository = "https://github.com/lstasiak/emblema"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.12",
    "mypy>=1.16",
    "ty>=0.0.1a1",
    "import-linter>=2.0",
    "pre-commit>=4.0",
    "pytest-cov>=6.0",
    "boto3-stubs[s3]>=1.43",
    "inflate64>=1.0.4",
    "matplotlib>=3.10",
    "typing-extensions>=4.7",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]
# The lock must provide wheels for every target platform, so a missing wheel fails here, not at
# deploy time: Linux arm64 (local containers on M1), Linux x86_64 (CI, GPU platforms), macOS arm64
# (native ML worker).
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# CPU-only PyTorch index: inference targets CPU, and CI and local environments never need CUDA.
# GPU platforms (Kaggle/Colab) use their preinstalled CUDA torch; pip ignores this section there.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade (bounded by target-version = py312)
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PT",       # pytest style
    "RUF",      # ruff-specific
    "TID",      # tidy imports
    "D",        # pydocstyle: Google style where a docstring exists
]
# Docstrings are required only where they add information; their presence is a review decision,
# their style is not.
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
# The multiplication sign is deliberate in report output ("d × L"), never a typo for x.
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# Developer scripts that import a sibling package: the path is set up before the imports run.
"scripts/corpus_facts.py" = ["E402"]
"scripts/loader_throughput_report.py" = ["E402"]
"scripts/window_sanity_report.py" = ["E402"]
"scripts/published_corpus_report.py" = ["E402"]
"scripts/encoder_budget_report.py" = ["E402"]
"scripts/synthetic_control_report.py" = ["E402"]
"scripts/masked_reconstruction_report.py" = ["E402"]
"scripts/masked_reconstruction_assessment.py" = ["E402"]
"scripts/masked_reconstruction_figures.py" = ["E402"]
"scripts/training_loop_report.py" = ["E402"]
"scripts/corpus_saturation_report.py" = ["E402"]
"scripts/corpus_saturation_figures.py" = ["E402"]
"scripts/pretraining_curve_report.py" = ["E402"]
"scripts/pretraining_curve_figures.py" = ["E402"]
"scripts/excursion_report.py" = ["E402"]
"scripts/excursion_figures.py" = ["E402"]
"scripts/held_out_units.py" = ["E402"]
"scripts/transfer_modes_report.py" = ["E402"]
"scripts/label_curve_report.py" = ["E402"]
"scripts/label_curve_figures.py" = ["E402"]
"scripts/backbone_comparison_report.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["emblema", "scripts", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/emblema", "tests", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Adapters, entrypoints and tests talk to third-party code: relax the strictest checks there.
module = [
    "emblema.*.adapters.*",
    "emblema.entrypoints.*",
    "tests.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
# Third-party packages that ship no type information of their own.
module = ["onnxruntime", "onnxruntime.*", "pandas", "pandas.*"]
ignore_missing_imports = true

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs external services (Docker, network); skipped by default, run in CI jobs that provide them",
    "ml: needs the 'ml' extra (torch, onnxruntime)",
]

[tool.coverage.run]
source = ["emblema"]
branch = true
# A package's ``__main__`` only hands the process to its command line, and runs nowhere under test.
omit = ["*/__main__.py"]
# Paths stored relative to the repository root, so the data file is readable outside the job.
relative_files = true

[tool.coverage.report]
fail_under = 92
show_missing = true
skip_empty = true
# Lines that cannot run under test or carry no behaviour.
exclude_also = [
    'if TYPE_CHECKING:',
    '^\s*\.\.\.$',
    '@(abc\.)?abstractmethod',
    '@(typing\.)?overload',
    'raise NotImplementedError',
    'if __name__ == .__main__.:',
]

# Every contract has a deliberate-violation test in tests/architecture that proves it breaks.
[tool.importlinter]
root_packages = ["emblema"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "context-independence"
name = "Bounded contexts import only each other's published contracts"
type = "independence"
modules = ["emblema.catalog", "emblema.pretraining", "emblema.evaluation", "emblema.serving"]
# Consumers import contract modules, never the bare `contracts` package: it re-exports nothing.
ignore_imports = ["emblema.** -> emblema.*.contracts.**"]

[[tool.importlinter.contracts]]
id = "hexagonal-layers"
name = "Inside a context dependencies point inwards: adapters -> application -> ports -> domain"
type = "layers"
containers = ["emblema.catalog", "emblema.pretraining", "emblema.evaluation", "emblema.serving"]
# Parentheses mark a layer as optional: each context grows its layers with its first feature.
layers = ["(adapters)", "(application)", "(ports)", "(domain)"]

[[tool.importlinter.contracts]]
id = "shared-layers"
name = "Shared layers point inwards: adapters -> ports -> events -> kernel"
type = "layers"
containers = ["emblema.shared"]
layers = ["(adapters)", "(ports)", "(events)", "kernel"]

[[tool.importlinter.contracts]]
id = "pure-core"
name = "Domain, ports, application, contracts and shared code import no framework"
type = "forbidden"
# Only the framework-free parts of `emblema.shared`; `emblema.shared.adapters` may use frameworks.
source_modules = [
    "emblema.shared.kernel", "emblema.shared.ports", "emblema.shared.events",
    "emblema.*.domain", "emblema.*.ports", "emblema.*.application", "emblema.*.contracts",
]
forbidden_modules = [
    "torch", "numpy", "pandas", "onnx", "onnxruntime", "onnxscript",
    "sqlalchemy", "alembic",
    "fastapi", "starlette", "pydantic", "pydantic_settings",
    "celery", "redis", "mlflow", "boto3", "botocore",
]

[[tool.importlinter.contracts]]
id = "config-only-at-the-edges"
name = "Configuration is read by adapters and entrypoints only"
type = "forbidden"
source_modules = [
    "emblema.shared.kernel", "emblema.shared.ports", "emblema.shared.events",
    "emblema.*.domain", "emblema.*.ports", "emblema.*.application", "emblema.*.contracts",
]
forbidden_modules = ["emblema.config"]

[[tool.importlinter.contracts]]
id = "contracts-depend-only-on-shared"
name = "Published contracts depend on shared code only"
type = "forbidden"
source_modules = ["emblema.*.contracts"]
forbidden_modules = [
    "emblema.*.domain", "emblema.*.ports", "emblema.*.application", "emblema.*.adapters",
    "emblema.entrypoints",
]

[[tool.importlinter.contracts]]
id = "domain-shares-only-identity-with-contracts"
name = "A domain and its ports import nothing from their own published contracts except identifiers"
type = "forbidden"
# Identifiers are shared vocabulary; references and events are messages the application layer
# builds, so neither the domain nor its ports see them. One entry per context: a wildcard cannot
# tell a context's own contracts from another's, and a listed module must exist.
source_modules = ["emblema.catalog.domain", "emblema.catalog.ports"]
forbidden_modules = ["emblema.catalog.contracts"]
ignore_imports = ["emblema.catalog.domain.** -> emblema.catalog.contracts.identifiers"]

[[tool.importlinter.contracts]]
id = "evaluation-domain-shares-only-identity-with-contracts"
name = "Evaluation's domain and ports import nothing from their own published contracts except identifiers"
type = "forbidden"
source_modules = ["emblema.evaluation.domain", "emblema.evaluation.ports"]
forbidden_modules = ["emblema.evaluation.contracts"]
ignore_imports = [
    "emblema.evaluation.domain.** -> emblema.evaluation.contracts.identifiers",
    "emblema.evaluation.ports.** -> emblema.evaluation.contracts.identifiers",
]

[[tool.importlinter.contracts]]
id = "shared-imports-no-context"
name = "Shared code knows no bounded context"
type = "forbidden"
source_modules = ["emblema.shared"]
forbidden_modules = [
    "emblema.catalog", "emblema.pretraining", "emblema.evaluation", "emblema.serving",
    "emblema.config", "emblema.entrypoints",
]

[[tool.importlinter.contracts]]
id = "entrypoints-are-outermost"
name = "Nothing imports the entrypoints"
type = "forbidden"
source_modules = [
    "emblema.shared", "emblema.config",
    "emblema.catalog", "emblema.pretraining", "emblema.evaluation", "emblema.serving",
]
forbidden_modules = ["emblema.entrypoints"]
