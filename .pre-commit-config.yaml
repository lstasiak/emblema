# Development-loop checks. All tools run through uv so versions come from uv.lock.
# mypy (strict) is the authority in CI, not here: ty is the fast checker for the loop.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ty
        name: ty check
        entry: uv run ty check src tests scripts
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: lint-imports
        name: import-linter (architecture rules)
        entry: uv run lint-imports
        language: system
        types_or: [python, pyi, toml]
        pass_filenames: false
