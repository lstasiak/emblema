# The local stack: metadata database, S3-compatible artifact store, experiment tracking, the
# broker background work passes through, and the application's own processes.
# `docker compose up -d --wait` brings it up; values come from `.env` (copy `env.example`).
# Credentials are defined once, as the application reads them, and mapped here onto the services:
# the artifact key onto Garage's default key, MLflow's S3 client and the bootstrap job; the
# database role onto Postgres and MLflow's backend store. Nothing that authenticates has a
# default: a stack that starts on a fallback password runs with a password anyone can read here.
name: emblema

# Every process of the application sees the stack by service name rather than by the published
# port: inside the network there is no loopback to reach it on. Stated once and pointed at by
# each process, so that a service renamed is renamed in one place.
x-in-network: &in-network
  EMBLEMA_DATABASE__HOST: postgres
  EMBLEMA_DATABASE__PORT: "5432"
  EMBLEMA_BROKER__HOST: rabbitmq
  EMBLEMA_BROKER__PORT: "5672"
  EMBLEMA_ARTIFACT_STORE__ENDPOINT_URL: http://garage:3900

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${EMBLEMA_DATABASE__USER:?set in .env}
      POSTGRES_PASSWORD: ${EMBLEMA_DATABASE__PASSWORD:?set in .env}
      POSTGRES_DB: ${EMBLEMA_DATABASE__NAME:?set in .env}
    ports:
      - "127.0.0.1:${EMBLEMA_DATABASE__PORT:?set in .env}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty volume: creates the MLflow database and one schema per context.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EMBLEMA_DATABASE__USER:?set in .env} -d ${EMBLEMA_DATABASE__NAME:?set in .env}"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-alpine
    # The broker a campaign's cells are handed to; the workers that consume them are below.
    environment:
      RABBITMQ_DEFAULT_USER: ${EMBLEMA_BROKER__USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${EMBLEMA_BROKER__PASSWORD:?set in .env}
      RABBITMQ_DEFAULT_VHOST: ${EMBLEMA_BROKER__VHOST:?set in .env}
    ports:
      - "127.0.0.1:${EMBLEMA_BROKER__PORT:?set in .env}:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12

  garage:
    image: dxflrs/garage:v2.4.1
    entrypoint: ["/garage", "-c", "/etc/garage.toml"]
    # Single node, no replication, and the bucket plus its key created from the environment.
    command: ["server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${EMBLEMA_ARTIFACT_STORE__ACCESS_KEY:?set in .env}
      GARAGE_DEFAULT_SECRET_KEY: ${EMBLEMA_ARTIFACT_STORE__SECRET_KEY:?set in .env}
      GARAGE_DEFAULT_BUCKET: ${EMBLEMA_ARTIFACT_STORE__BUCKET:-emblema}
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 12

  mlflow:
    build: ./infra/mlflow
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://garage:3900
      AWS_ACCESS_KEY_ID: ${EMBLEMA_ARTIFACT_STORE__ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${EMBLEMA_ARTIFACT_STORE__SECRET_KEY:?set in .env}
      AWS_DEFAULT_REGION: ${EMBLEMA_ARTIFACT_STORE__REGION:-garage}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    # Raw training logs and MLflow's own artifacts live under one prefix of the shared bucket;
    # the platform's content-addressed artifacts live under the environment prefixes.
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg://${EMBLEMA_DATABASE__USER:?set in .env}:${EMBLEMA_DATABASE__PASSWORD:?set in .env}@postgres:5432/mlflow
      - --artifacts-destination=s3://${EMBLEMA_ARTIFACT_STORE__BUCKET:-emblema}/mlflow
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 24

  bootstrap:
    # One-shot job: makes sure the bucket exists and carries the lifecycle rules. The same script
    # runs against the remote bucket with `docker compose --env-file .env.r2 run --rm --no-deps bootstrap`.
    image: amazon/aws-cli:2.36.41
    depends_on:
      garage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${EMBLEMA_ARTIFACT_STORE__ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${EMBLEMA_ARTIFACT_STORE__SECRET_KEY:?set in .env}
      AWS_DEFAULT_REGION: ${EMBLEMA_ARTIFACT_STORE__REGION:-garage}
      AWS_ENDPOINT_URL: ${BOOTSTRAP_ENDPOINT_URL:-http://garage:3900}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_PAGER: ""
      BUCKET: ${EMBLEMA_ARTIFACT_STORE__BUCKET:-emblema}
      ENVIRONMENT_PREFIXES: ${ARTIFACT_ENVIRONMENT_PREFIXES:-dev test}
      TRANSIENT_RETENTION_DAYS: ${TRANSIENT_RETENTION_DAYS:-7}
    entrypoint: ["bash", "/scripts/bootstrap-bucket.sh"]
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"

  worker-ml:
    # Consumes the cells that train or score a network. Behind a profile because a worker is told
    # which backbone it serves and there is none until a pretraining run has been accepted, so a
    # fresh clone brings up the stack without it: `docker compose --profile workers up -d`.
    #
    # One job at a time and no forking: a process that has imported the training stack cannot
    # safely fork. It computes on the processor. A cell on the host's accelerator goes through
    # `campaign order` and `campaign_run`, never through a worker started on the host: a long
    # cell starves the broker's heartbeats, and a run that is not an order checks no commit.
    profiles: ["workers"]
    build:
      context: .
      target: runtime
      args:
        EXTRAS: ml
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *in-network
      # Where the corpora and the workspace sit is decided by this image and the volumes below,
      # not by whoever wrote the file: a path from somebody's host means nothing in here.
      EMBLEMA_WORKER__WORKSPACE: /home/emblema/data/workspace
      EMBLEMA_WORKER__CORPORA: /home/emblema/data/raw
      EMBLEMA_WORKER__DEVICE: cpu
    volumes:
      # The corpora are an input and a task's labels are read out of them; the workspace is where
      # blocks are fetched to, and it is the process's own rather than the host directory the
      # worker on the host uses.
      - ./data/raw:/home/emblema/data/raw:ro
      - worker-workspace:/home/emblema/data/workspace
    # No healthcheck: what would answer one is Celery's remote control, and the mailbox it runs
    # over is a kind of queue RabbitMQ 4 has withdrawn, so the application switches it off. That a
    # worker reported for work is read from its log.
    command:
      - celery
      - -A
      - emblema.entrypoints.workers.ml.celery_app
      - worker
      - --queues=ml
      - --pool=solo
      - --without-mingle
      - --without-gossip
      # A worker that says nothing cannot be operated: at the default level it reports neither
      # the connection it made nor the job it took.
      - --loglevel=info

  worker-general:
    # Consumes everything that needs nothing of the machine-learning stack, which today is the
    # classical candidates a campaign compares the network against. A separate image rather than
    # another command on the same one: this one carries no training stack, which is less than
    # half the size, and a campaign made only of baselines then proves that the Evaluation
    # context needs nothing of the Pretraining one by running where that stack is not installed.
    profiles: ["workers"]
    build:
      context: .
      target: runtime
      args:
        EXTRAS: baselines
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *in-network
      EMBLEMA_WORKER__WORKSPACE: /home/emblema/data/workspace
      EMBLEMA_WORKER__CORPORA: /home/emblema/data/raw
    volumes:
      - ./data/raw:/home/emblema/data/raw:ro
      - general-workspace:/home/emblema/data/workspace
    # Solo like its neighbour, though for a plainer reason: a fit holds the processor for as long
    # as it runs, so a second one beside it would take the threads the first was told to use.
    command:
      - celery
      - -A
      - emblema.entrypoints.workers.general.celery_app
      - worker
      - --queues=general
      - --pool=solo
      - --without-mingle
      - --without-gossip
      - --loglevel=info

  tests:
    # The suite as it is run before a merge: everything installed, the repository mounted so a run
    # needs no rebuild, and the stack reachable, so the tests that need services run here too.
    # `docker compose run --rm tests` for the whole of it, arguments appended for a part.
    profiles: ["tests"]
    build:
      context: .
      target: tests
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *in-network
    volumes:
      - .:/app
    working_dir: /app

volumes:
  postgres-data:
  worker-workspace:
  general-workspace:
  garage-meta:
  garage-data:
