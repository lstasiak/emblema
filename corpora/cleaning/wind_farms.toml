# Bounds a publication of a wind farm's turbine tables holds its values to (ADR-0078, ADR-0085):
# a value below removed_below or above removed_above is removed and reads as never measured.
# Nothing is clipped, so the inner bounds repeat the outer ones. The bounds are one wide physical
# range per unit, which no working sensor of a turbine leaves: -50 to 150 degrees Celsius, 0 to
# 60 metres a second, -10 to 2,500 revolutions a minute. What lies outside is a failed sensor's
# sentinel (-273.2 degrees, 215.0 degrees, -15.0 metres a second) or a ten-minute average over
# one. A channel in another unit has no range here and is published as read. Both farms carry
# the same signals, so one file serves both.

# Degrees Celsius

[[bounds]]
channel = "Ambient temperature (converter)"
removed_below = -50.0
clipped_below = -50.0
clipped_above = 150.0
removed_above = 150.0

