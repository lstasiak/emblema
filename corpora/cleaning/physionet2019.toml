# Bounds a publication of PhysioNet 2019 holds its values to (ADR-0078): a value below
# removed_below or above removed_above is removed and reads as never measured; one below
# clipped_below or above clipped_above is clipped to it. Every row is MIMIC-Extract's variable
# range for the quantity (Wang et al., CHIL 2020; resources/variable_ranges.csv, SHA-256
# f4bf5853dc3e2276e26a33358961617dcc6018d496bfd3118b9c6ef2131d0c06): outlier low, valid low, valid
# high, outlier high, in that order, named in the comment above each row. The reader labels FiO2 a
# percent and Lactate in mg/dL, but the values are a fraction (median 0.5) and in mmol/L (median
# 1.8), the units of the table's rows, so the rows apply unscaled. A channel not named here has no
# row in that table and is published as read: Age, Gender, HospAdmTime, the units, BaseExcess,
# Bilirubin_direct, Calcium, EtCO2 and Fibrinogen.

# Alkaline phosphate
[[bounds]]
channel = "Alkalinephos"
removed_below = 0.0
clipped_below = 20.0
clipped_above = 3625.0
removed_above = 4000.0

