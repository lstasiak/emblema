# Bounds a publication of PhysioNet 2012 holds its values to (ADR-0078): a value below
# removed_below or above removed_above is removed and reads as never measured; one below
# clipped_below or above clipped_above is clipped to it. Every row is MIMIC-Extract's variable
# range for the quantity (Wang et al., CHIL 2020; resources/variable_ranges.csv, SHA-256
# f4bf5853dc3e2276e26a33358961617dcc6018d496bfd3118b9c6ef2131d0c06): outlier low, valid low, valid
# high, outlier high, in that order, named in the comment above each row. FiO2 is a fraction, as
# the table's row is. A channel not named here has no row in that table and is published as read:
# Age, Gender, MechVent and the ICU types.

