# Epochs the masked-reconstruction report trains a corpus for when the command line names none, per
# compute tier. A corpus or tier without an entry has no default, and a run of it names its epochs.
# Kept out of the report's code so that recording a measurement does not change the code digest the
# measured runs are compared under.
#
# Measured, not guessed, and measured for what the report decides rather than for the loss: an entry
# is the fewest epochs E for which the runs of E / 2, E and 2E gave every kind of mask the same
# verdict — learnt against its matched baseline and beyond the linear one — placed a doubling past
# the first budget that was learnt, because MPS does not repeat a run bit for bit. The loss has not
# converged at these epochs, so a run keeps its convergence warning. The runs, their losses and
# verdicts, and the spread between repeats are in docs/verification/masked-reconstruction.md.

[S]
control-a = 24
control-b = 20
spectral-probe = 24
