# Facts and assumptions behind the pretraining budget. Numbers live here, arithmetic lives in
# corpus_budget_report.py, so a later measurement corrects this file and nothing else.
#
# Per corpus: `estimate` holds literature figures used until `measured` exists; `measured` is the
# block corpus_facts.py prints from the raw files. Verdicts: `pretraining` enters the pretraining
# mix and gets a single-corpus backbone; `downstream-only` hosts a task and is never pretrained on;
# `candidate` awaits a decision; `rejected` is out. Window `unit` is samples for regular corpora
# and hours for irregular ones.

# Both terms count FLOPs with a multiply-add as two operations and backward as twice forward:
# 2 × 3 = 6 per parameter per token in the dense layers; attention scores and their weighted sum
# are 2 × 2 × tokens² × width per layer forward, hence 12 × tokens² × width × layers.
[cost_model]
flops_per_parameter_token = 6
attention_flops_coefficient = 12
estimate_error_factor = 3

[thresholds]
min_training_units = 20          # a unit-level split must leave something on each side
unique_tokens_per_parameter = 20 # Chinchilla's ratio as a reference point; fitted to language models
effective_repetitions = 4        # repeated data is worth about as much as fresh data up to ~4 epochs
gpu_hours_cap = 150              # T4-class; above it the scale knobs are turned before any long run

# Throughputs are sustained, not peak: T4 in fp16 with fused attention, an M1 Pro through MPS in
# fp32, an A100 in bf16 at the ratio the paid platform prices it against the T4.
[[tiers]]
name = "S"
device = "M1 Pro, MPS, fp32"
tflops = 1.25
width = 192
layers = 4
corpus_fraction = 0.1
window = "default"

[[tiers]]
name = "M"
device = "T4, fp16"
tflops = 10.0
width = 256
layers = 6
corpus_fraction = 1.0
window = "default"

[[tiers]]
name = "L"
device = "A100 40 GB, bf16"
tflops = 50.0
width = 256
layers = 6
corpus_fraction = 1.0
window = "longest"

