# Estimate: lightweight subsets (Mission1 channels 41–46, Mission2 channels 18–28), training halves of
# 84 and 21 months, at most one observation per channel per 30 s. Mission1's native rate averages
# one point per 43 s per channel, so its count is native (≈ 30M); Mission2's native rate is one per
# 14 s, so its count is capped by the spacing (≈ 20M). Mission3 (48 channels, 8 years) is measured
# but not estimated: the benchmark excludes it for gaps and trivial anomalies.
[corpora.esa_ad.estimate]
units = 2
channels = 17
series_length = 38325
observations_per_unit = 25000000
native_observations = 776000000
basis = "Kotowski et al. 2024, Table 1: 76 + 100 channels, 775M + 777M points (half of them in the training halves), 14 + 3.5 years; lightweight subsets and the split from the same paper"

[corpora.esa_ad.subsampling]
channel_set = "lightweight"
min_spacing_seconds = 30
portion = "first-half"
missions = ["ESA-Mission1", "ESA-Mission2"]

[corpora.esa_ad.subsampling.lightweight]
ESA-Mission1 = [41, 46]
ESA-Mission2 = [18, 28]

[[corpora.esa_ad.windows]]
name = "h1s1"
unit = "hours"
length = 1
stride = 1
default = true

[[corpora.esa_ad.windows]]
name = "h3s3"
unit = "hours"
length = 3
stride = 3

[[corpora.esa_ad.windows]]
name = "h6s6"
unit = "hours"
length = 6
