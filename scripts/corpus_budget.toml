# ----------------------------------------------------------------------------------------------
# Pretraining programme, fine-tuning campaigns, fixed allowances, parameter sweep
# ----------------------------------------------------------------------------------------------

[[backbones]]
name = "single corpus"
corpora = "each-eligible"

[[backbones]]
name = "mixed"
corpora = "eligible"

[[backbones]]
name = "leave-one-corpus-out"
corpora = "eligible"
leave_one_out = true
count = 2

[[backbones]]
name = "mixed with channel dropout"
corpora = "eligible"

[[campaigns]]
name = "first-result grid"
runs = 80
budget = 1000
epochs = 30
task_corpus = "cmapss"

[[campaigns]]
name = "transfer matrix (8 backbones × 4 tasks × 2 budgets × 5 seeds)"
runs = 320
budget = 1000
epochs = 30
task_corpus = "cmapss"

[[campaigns]]
name = "budget 'all' on C-MAPSS, 5 seeds"
runs = 5
budget = "all"
epochs = 30
task_corpus = "cmapss"

[[fixed_costs]]
name = "ablations, channel dropout, distillation"
gpu_hours = 30
basis = "allowance of 20–40 h, midpoint; priced when the runs are designed"

[sweep]
shapes = [[192, 4], [256, 6], [320, 8], [384, 10], [512, 8]]
