name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format=github
      - name: Format
        run: uv run ruff format --check

  types:
    name: types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Type check
        run: uv run mypy

  architecture:
    # Static analysis of the import graph: the ML extras are not needed here. Every step runs one
    # rule family so a red check names the rule that was broken.
    name: architecture rules (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - name: Domain, application and shared code import no framework
        run: uv run lint-imports --contract pure-core
      - name: Contexts import only each other's published contracts
        run: uv run lint-imports --contract context-independence
      - name: Layers point inwards within each context and inside shared
        run: uv run lint-imports --contract hexagonal-layers --contract shared-layers
      - name: Remaining dependency rules
        run: >
          uv run lint-imports
          --contract config-only-at-the-edges
          --contract contracts-depend-only-on-shared
          --contract domain-shares-only-identity-with-contracts
          --contract evaluation-domain-shares-only-identity-with-contracts
          --contract shared-imports-no-context
          --contract entrypoints-are-outermost

  compose:
    # The local stack must come up from a clean machine with one command and pass its smoke test.
    # This proves it on amd64; arm64 is verified by hand on the development machine.
    name: local stack (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure the stack
        # As the README has a person do it, with the worker group uncommented rather than copied
        # here: what the worker is told is stated once, in the template, and this run is what
        # proves the template still says all of it. A later assignment in the file wins, so the
        # values that must not be readable here come last and live and die inside this runner.
        # Garage expects its access key as `GK` followed by 32 hex digits, and the backbone is a
        # reference to nothing — reporting for work reads nothing out of the store.
        run: |
          sed 's/^# \(EMBLEMA_WORKER__\)/\1/' env.example > .env
          {
            echo "EMBLEMA_DATABASE__PASSWORD=$(openssl rand -hex 16)"
            echo "EMBLEMA_BROKER__PASSWORD=$(openssl rand -hex 16)"
            echo "EMBLEMA_ARTIFACT_STORE__ACCESS_KEY=GK$(openssl rand -hex 16)"
            echo "EMBLEMA_ARTIFACT_STORE__SECRET_KEY=$(openssl rand -hex 32)"
            echo "EMBLEMA_WORKER__BACKBONE=dev/durable/absent@sha256:$(openssl rand -hex 32)"
          } >> .env
      - name: Validate the compose file
        run: docker compose --profile workers --profile tests config --quiet
      - name: Build the worker images
        # The recipe every process of the application is deployed from, once per set of extras.
        # The test image shares its stages and differs only in what it installs, so it is left to
        # the machine that runs the suite in it.
        run: docker compose --profile workers build worker-ml worker-general
      - name: Bring the stack up
        run: docker compose up -d --wait --wait-timeout 300
      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: Every worker reports for work from inside the stack
        # Two failures this catches. One is a worker that starts, never finishes starting and
        # consumes nothing, which is what a broker refusing a queue Celery declares looks like.
        # The other is a worker that was not told what it serves: each assembles itself where it
        # is started, so a template missing a group leaves the process it belongs to exited.
        run: |
          docker compose --profile workers up -d worker-ml worker-general
          for _ in $(seq 1 45); do
            ready=0
            for worker in worker-ml worker-general; do
              if docker compose logs "$worker" --no-color | grep -q 'ready\.'; then
                ready=$((ready + 1))
              fi
            done
            if [ "$ready" -eq 2 ]; then
              exit 0
            fi
            sleep 2
          done
          echo "a worker never reported ready" >&2
          exit 1
      - name: Service logs
        if: failure()
        run: docker compose --profile workers logs --no-color
      - name: Tear down
        if: always()
        run: docker compose --profile workers --profile tests down -v

  test:
    # The environment must build on the requires-python floor (GPU platforms) and on the local
    # development version. CPU-only torch index is configured in pyproject.toml.
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      # The coverage comment action edits its own PR comment and pushes badge data to the
      # python-coverage-comment-action-data branch.
      pull-requests: write
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      # What this job configures the stack with, stated here rather than for the whole workflow:
      # the job that brings the stack up the way a person does reads everything out of `.env`,
      # and a variable in the runner's environment would win the interpolation against that file
      # and leave the services and the smoke test disagreeing about who the role is.
      #
      # A role name authenticates nobody. Every secret the local stack needs is minted per run by
      # the jobs that start it, so no password or access key is written down in this repository.
      # The bucket the contract tests reach is the Garage service started below, published on the
      # runner's loopback interface. No field of the store has a default value.
      EMBLEMA_DATABASE__HOST: 127.0.0.1
      EMBLEMA_DATABASE__PORT: "5432"
      EMBLEMA_DATABASE__NAME: emblema
      EMBLEMA_DATABASE__USER: ci
      EMBLEMA_BROKER__HOST: 127.0.0.1
      EMBLEMA_BROKER__PORT: "5672"
      EMBLEMA_BROKER__USER: ci
      EMBLEMA_BROKER__VHOST: "/"
      EMBLEMA_ARTIFACT_STORE__ENDPOINT_URL: http://127.0.0.1:3900
      EMBLEMA_ARTIFACT_STORE__REGION: garage
      EMBLEMA_ARTIFACT_STORE__BUCKET: emblema
      EMBLEMA_ARTIFACT_STORE__KEY_PREFIX: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync environment from lockfile
        run: uv sync --locked --all-extras --all-groups

      - name: Report stack versions
        run: uv run python -c "import sys, torch, onnxruntime; print(sys.version); print('torch', torch.__version__); print('onnxruntime', onnxruntime.__version__)"

      - name: Mint credentials for the local stack
        # As in the compose job: minted here, gone with the runner, absent from the repository.
        run: |
          {
            echo "EMBLEMA_DATABASE__PASSWORD=$(openssl rand -hex 16)"
            echo "EMBLEMA_BROKER__PASSWORD=$(openssl rand -hex 16)"
            echo "EMBLEMA_ARTIFACT_STORE__ACCESS_KEY=GK$(openssl rand -hex 16)"
            echo "EMBLEMA_ARTIFACT_STORE__SECRET_KEY=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Start the artifact store and the metadata database
        run: docker compose up -d --wait garage postgres

      - name: Migrate the metadata database
        run: uv run alembic upgrade head

      - name: Test with coverage
        # Integration tests run here too (the store is up), so the S3 adapter counts towards the
        # threshold, which is `fail_under` in pyproject.toml. Locally the default addopts skip them.
        run: uv run pytest -o addopts="-ra --strict-markers" --cov --cov-report=term-missing --cov-report=xml

      - name: Stop the local services
        if: always()
        run: docker compose down -v

      - name: Coverage in the job summary
        if: always()
        run: |
          echo "## Coverage (Python ${{ matrix.python }})" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          retention-days: 14

      # One matrix entry owns the PR comment and the badge data; the other would only race it.
      - name: Coverage comment and badge data
        id: coverage_comment
        if: matrix.python == '3.14'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 92
          MINIMUM_ORANGE: 80
          ANNOTATE_MISSING_LINES: true

      - name: Store the PR comment for the post workflow (forks)
        if: matrix.python == '3.14' && steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
