# A backbone over the intensive-care stays at the tier a laptop runs, for one purpose: to carry
# a campaign on the binary task end to end before its real backbones are trained. Its weights are
# not a result, and nothing measured with it is cited.
#
# Two epochs are the fewest that give the loss a second point; the mixture and the schedule's
# shape are the ones every other backbone of this project was learnt under.
name = "smoke-physionet2012-s"
tier = "S"
corpora = ["physionet2012"]
precision = "fp32"
dropout = 0.0
decoder_layers = 1

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1

[budget]
epochs = 2
batch_size = 32
accumulation_steps = 1
learning_rate = 1e-3
warmup_epochs = 0.25
final_lr_fraction = 0.01
seed = 1

[checkpoint]
every_steps = 500
