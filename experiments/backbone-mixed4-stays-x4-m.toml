# The mixture of four (backbone-mixed4-m.toml) with the intensive-care stays read four times an
# epoch, each pass in its own order, and nothing else changed. In the mixture the stays are 4 %
# of the steps and 1 % of the tokens, and the mixture teaches them what eight passes over the
# stays alone teach (0.489 against 0.487 of the trivial predictor's loss), while the backbone
# over the stays alone chosen for the task had thirty-two passes. Four passes inside the mixture
# give the stays those thirty-two over the run, at about 12 % more steps.
#
# About 3,170 steps an epoch: 60 % the satellite corpus, 20 % C-MAPSS, 16 % the stays, 4 % SKAB.
# Read against backbone-mixed4-m.toml on the in-hospital-death task, and on the turbofan task
# for what the other corpora lose.
name = "backbone-mixed4-stays-x4-m"
tier = "M"
corpora = ["cmapss", "skab", "esa_ad", "physionet2012"]
precision = "fp16"
dropout = 0.0
decoder_layers = 1

[passes]
physionet2012 = 4

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1

[objective]
kind = "huber"
huber_delta = 1.0

[budget]
epochs = 8
batch_size = 16
accumulation_steps = 2
learning_rate = 1e-3
warmup_epochs = 0.25
final_lr_fraction = 0.01
seed = 1

[checkpoint]
every_steps = 2000
