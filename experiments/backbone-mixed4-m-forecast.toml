# The mixture of four under a pretext that asks for the future rather than for what lies between
# visible tokens. Everything is the file of backbone-mixed4-m.toml to the step except what is
# hidden: every window loses its tail, every channel at once, its length drawn uniformly between
# 15 % and 50 % of the window, as Moirai draws its horizon (Woo et al., 2024). Blocks and single
# tokens are not drawn, since both are answered from the channel's own neighbours on either side;
# whole channels are, at the same rate, since inferring a channel from the others is not
# interpolation. About 43 % of a window is hidden, against 46 % under the mixture's masks.
#
# Whether this pretext or the mixture's serves the intensive-care task better is read by the
# closed-form probe at 50 stays on a fifth of the tuning side, not by this run's loss: a loss
# under other masks does not compare.
name = "backbone-mixed4-m-forecast"
tier = "M"
corpora = ["cmapss", "skab", "esa_ad", "physionet2012"]
precision = "fp16"
dropout = 0.0
decoder_layers = 1

[masking]
channel_rate = 0.15
block_rate = 0.0
block_span = 0.5
token_rate = 0.0
horizon_rate = 1.0
horizon_min_span = 0.15
horizon_max_span = 0.5

[objective]
kind = "huber"
huber_delta = 1.0

[budget]
epochs = 8
batch_size = 16
accumulation_steps = 2
learning_rate = 1e-3
warmup_epochs = 0.25
final_lr_fraction = 0.01
seed = 1

[checkpoint]
every_steps = 2000
