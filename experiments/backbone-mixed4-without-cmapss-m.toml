# The mixture of four (backbone-mixed4-m.toml) without C-MAPSS: the same publications, read in
# the same order, with the turbofan corpus left out, so a turbofan task reads this backbone as
# one that never saw an engine. Its channels keep their rows in the table, untrained, because the
# vocabulary is chained through the publication that is skipped.
#
# About 2,160 steps an epoch: 89 % the satellite corpus, 6 % SKAB, 6 % the stays.
name = "backbone-mixed4-without-cmapss-m"
tier = "M"
corpora = ["skab", "esa_ad", "physionet2012"]
precision = "fp16"
dropout = 0.0
decoder_layers = 1

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1

[objective]
kind = "huber"
huber_delta = 1.0

[budget]
epochs = 8
batch_size = 16
accumulation_steps = 2
learning_rate = 1e-3
warmup_epochs = 0.25
final_lr_fraction = 0.01
seed = 1

[checkpoint]
every_steps = 2000
