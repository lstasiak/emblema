# The point of about 10⁹ observed values without the PhysioNet 2012 stays
# (backbone-scale-1e9-without-physionet2012-m, ba2912dd-…), continued over those stays with the
# channel table alone free: the rows of 2012's channels, which sit inside the point's table at
# their initialisation, fitted on the stays' unlabelled training side under the point's own
# pretext, every other weight the point's. The same fit as -without-physionet2019-rows-m, with
# the same recipe at a micro-batch of 8 accumulated eight times, since a batch of 64 stays of
# 2012 does not fit this machine's accelerator at once; the stays' training side is small, so
# it is read whole over sixteen epochs for about a thousand steps. The table of the run is the
# stays' publication's, 195 channels: the point's rows past them are left behind.
name = "backbone-scale-1e9-without-physionet2012-rows-m"
tier = "M"
corpora = ["physionet2012"]
precision = "fp32"
dropout = 0.0
decoder_layers = 1
trained = "channel_rows"

[start]
weights = "durable/sha256/845fcd38228913dc25c0388922845b15f01a5035701dbb316b588e2259d842c6"
checksum = "sha256:845fcd38228913dc25c0388922845b15f01a5035701dbb316b588e2259d842c6"

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1

# Bounded at one standard deviation, as the point was read.
[objective]
kind = "huber"
huber_delta = 1.0

[budget]
epochs = 16
batch_size = 8
accumulation_steps = 8
learning_rate = 1e-2
warmup_epochs = 0
final_lr_fraction = 1.0
seed = 1

[checkpoint]
every_steps = 2000
