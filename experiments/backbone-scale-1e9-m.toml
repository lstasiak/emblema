# The point of about 10⁹ observed values on the curve over the scale of pretraining, in today's
# shape: the whole of the publication backbone-scale-3e8-m.toml reads a quarter of, and the
# PhysioNet 2019 stays, published last in the chain once the sepsis task had drawn its frozen side.
# The chain continues the mixture of four (backbone-mixed4-m.toml): C-MAPSS read per operating
# condition, SKAB, the satellite telemetry and the intensive-care stays, then the Tennessee Eastman
# runs and the 25 datasets of UTSD-12G, each a corpus of its own in one vocabulary.
#
# Two epochs, the best kept by the pretext's validation loss: a billion values are read twice, as
# the general-purpose models of the literature read theirs. The corpora a task reads keep the
# exposure of the mixture of four — two epochs times four passes are its eight reads — so C-MAPSS
# and the two sets of stays are read as often as there, beside about fifteen times the data.
name = "backbone-scale-1e9-m"
tier = "M"
corpora = [
    "cmapss",
    "skab",
    "esa_ad",
    "physionet2012",
    "tep",
    "utsd/ERA5_pressure",
    "utsd/ERA5_surface",
    "utsd/Energy_australian_electricity_demand_dataset",
    "utsd/Energy_london_smart_meters_dataset_without_missing_values",
    "utsd/Environment_AustraliaRainfall",
    "utsd/Environment_BeijingPM25Quality",
    "utsd/Environment_BenzeneConcentration",
    "utsd/Health_AtrialFibrillation",
    "utsd/Health_BIDMC32HR",
    "utsd/Health_IEEEPPG",
    "utsd/Health_MotorImagery",
    "utsd/Health_PigArtPressure",
    "utsd/Health_PigCVP",
    "utsd/Health_SelfRegulationSCP1",
    "utsd/Health_SelfRegulationSCP2",
    "utsd/Health_TDBrain_csv",
    "utsd/IoT_baian",
    "utsd/Nature_EigenWorms",
    "utsd/Nature_Phoneme",
    "utsd/Nature_StarLightCurves",
    "utsd/Nature_Worms",
    "utsd/Nature_kdd_cup_2018_dataset_without_missing_values",
    "utsd/Nature_temperature_rain_dataset_without_missing_values",
    "utsd/Transport_pedestrian_counts_dataset",
    "utsd/Web_kaggle_web_traffic_dataset_without_missing_values",
    "physionet2019",
]
precision = "fp16"
dropout = 0.0
decoder_layers = 1

[passes]
cmapss = 4
physionet2012 = 4
physionet2019 = 4

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1

# Bounded at one standard deviation, as every mixture since the satellite corpus was read so.
[objective]
kind = "huber"
huber_delta = 1.0

[budget]
epochs = 2
batch_size = 16
accumulation_steps = 2
learning_rate = 1e-3
warmup_epochs = 0.25
final_lr_fraction = 0.01
seed = 1

[checkpoint]
every_steps = 2000
