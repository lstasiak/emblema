# The base recipe of the screen over the composition: the stays of 2012, 2019 and the eICU demo
# with the raw satellite telemetry, pretrained over cells. Half the 2012 and half the 2019
# training stays, each ranked by the run's seed, so a task reads stays the pretraining saw and
# stays it did not; the first half of each mission's months; each corpus read as often as a
# sampling temperature of one half gives it, in whole passes (6, 2, 10 and 1). The 17 epochs
# were read off backbone-cells-composition-budget-m.toml's validation by the rule written before
# it ran (every term had stopped learning by the seventeenth); the shape, cells, masks, terms
# and step are that run's. Two seeds: a recipe is screened under two pretrainings.
name = "backbone-cells-composition-m"
tier = "M"
corpora = ["physionet2012", "physionet2019", "eicu_demo", "esa_ad_raw"]
precision = "fp32"
dropout = 0.0
decoder_layers = 1

[fraction]
physionet2012 = 0.5
physionet2019 = 0.5

[passes]
physionet2012 = 6
physionet2019 = 2
eicu_demo = 10

[shape]
width = 64
heads = 16
layers = 2
feedforward_width = 128

[input]
bins = 6

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1

[objective]
kind = "huber"
huber_delta = 1.0
presence_weight = 1.0
count_weight = 0.5

[budget]
epochs = 17
batch_size = 32
accumulation_steps = 1
learning_rate = 1e-3
warmup_epochs = 0.5
final_lr_fraction = 0.01
seed = 1

[checkpoint]
every_steps = 2000
