# The control of backbone-scale-1e9-continued-clinical-m.toml for the parameters moved: the same
# continuation of the point of about 10⁹ values over the two intensive-care corpora, the same
# steps and schedule, with the channel table alone free and every other weight the point's. The
# base learnt these corpora's rows already, so this run is expected to leave the point about
# where it is; what the continuation with everything free reads beyond it is what freeing the
# encoder adds. The file differs from the continuation in what is trained and in nothing else.
name = "backbone-scale-1e9-continued-clinical-rows-m"
tier = "M"
corpora = ["physionet2012", "physionet2019"]
precision = "fp32"
dropout = 0.0
decoder_layers = 1
trained = "channel_rows"

[start]
weights = "durable/sha256/8e7fa11d299cce959c8ec0f08f7cf1823367a138c267ee07c2451ccf8eb492b9"
checksum = "sha256:8e7fa11d299cce959c8ec0f08f7cf1823367a138c267ee07c2451ccf8eb492b9"

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1

# Bounded at one standard deviation, as the point was read.
[objective]
kind = "huber"
huber_delta = 1.0

[budget]
epochs = 4
batch_size = 8
accumulation_steps = 4
learning_rate = 1e-4
warmup_epochs = 0.25
final_lr_fraction = 0.01
seed = 1

[checkpoint]
every_steps = 2000
