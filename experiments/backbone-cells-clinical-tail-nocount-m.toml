# The tail hidden and the count's term dropped together: with the tail and without the count the
# four clinical recipes cross both knobs, so each knob's effect is read over four pretrainings
# against four, and whether the count matters only under the tail, where it asks about bins no
# visible cell describes, can be seen. Everything else is backbone-cells-clinical-m.toml.
name = "backbone-cells-clinical-tail-nocount-m"
tier = "M"
corpora = ["physionet2012", "physionet2019"]
precision = "fp32"
dropout = 0.0
decoder_layers = 1

[fraction]
physionet2012 = 0.5

[passes]
physionet2012 = 5

[shape]
width = 64
heads = 16
layers = 2
feedforward_width = 128

[input]
bins = 6

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1
horizon_rate = 0.5
horizon_min_span = 0.25
horizon_max_span = 0.5

[objective]
kind = "huber"
huber_delta = 1.0
presence_weight = 1.0
count_weight = 0.0

[budget]
epochs = 19
batch_size = 32
accumulation_steps = 1
learning_rate = 1e-3
warmup_epochs = 0.5
final_lr_fraction = 0.01
seed = 1

[checkpoint]
every_steps = 2000
