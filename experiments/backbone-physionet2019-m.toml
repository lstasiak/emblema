# The PhysioNet 2019 stays alone, at the published tier: the near transfer to the in-hospital-death
# task of 2012, another hospital's intensive-care stream read hourly rather than by the minute,
# and the single-corpus backbone the sepsis task compares the mixtures with. Eight epochs, as the
# stays of 2012 alone ran (backbone-stays-small-m.toml read them eight times too), the best kept
# by the pretext's validation loss.
name = "backbone-physionet2019-m"
tier = "M"
corpora = ["physionet2019"]
precision = "fp16"
dropout = 0.0
decoder_layers = 1

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1

# Bounded at one standard deviation, as every mixture since the satellite corpus was read so.
[objective]
kind = "huber"
huber_delta = 1.0

[budget]
epochs = 8
batch_size = 16
accumulation_steps = 2
learning_rate = 1e-3
warmup_epochs = 0.25
final_lr_fraction = 0.01
seed = 1

[checkpoint]
every_steps = 2000
