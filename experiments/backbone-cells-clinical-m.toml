# The pretext over cells pretrained on the intensive-care corpora at the published tier: the base
# recipe of the screen of that pretext, and the arm the others are read against. Half the stays of
# the task's tuning side, ranked by the run's seed, at five passes an epoch beside the 2019 stays,
# so a task read on the half sits on stays the pretraining saw and on stays it did not; the shape,
# cells, masks, terms and step of backbone-cells-clinical-budget-m.toml, whose validation set the
# nineteen epochs by a rule written before it ran (every term had stopped learning by the
# nineteenth). Two seeds: a recipe is screened under two pretrainings or more.
name = "backbone-cells-clinical-m"
tier = "M"
corpora = ["physionet2012", "physionet2019"]
precision = "fp32"
dropout = 0.0
decoder_layers = 1

[fraction]
physionet2012 = 0.5

[passes]
physionet2012 = 5

[shape]
width = 64
heads = 16
layers = 2
feedforward_width = 128

[input]
bins = 6

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1

[objective]
kind = "huber"
huber_delta = 1.0
presence_weight = 1.0
count_weight = 0.5

[budget]
epochs = 19
batch_size = 32
accumulation_steps = 1
learning_rate = 1e-3
warmup_epochs = 0.5
final_lr_fraction = 0.01
seed = 1

[checkpoint]
every_steps = 2000
