# The base recipe with the corpora read on a grid added: C-MAPSS per operating condition, SKAB and
# the satellite telemetry beside the intensive-care stays, whose half, passes and nineteen epochs
# are unchanged, so the stays are seen as often as in backbone-cells-clinical-m.toml and the grids'
# steps come on top. It asks whether data sampled on a grid harms what the stays teach; with the
# same number of steps instead, the stays would be seen at most eight times and the arm would read
# an encoder stopped half-way down their curve. On a grid every cell holds a reading, so there the
# pretext is a coarse interpolation (docs/verification/cell-pretext.md).
name = "backbone-cells-clinical-grids-m"
tier = "M"
corpora = ["cmapss", "skab", "esa_ad", "physionet2012", "physionet2019"]
precision = "fp32"
dropout = 0.0
decoder_layers = 1

[fraction]
physionet2012 = 0.5

[passes]
physionet2012 = 5

[shape]
width = 64
heads = 16
layers = 2
feedforward_width = 128

[input]
bins = 6

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1

[objective]
kind = "huber"
huber_delta = 1.0
presence_weight = 1.0
count_weight = 0.5

[budget]
epochs = 19
batch_size = 32
accumulation_steps = 1
learning_rate = 1e-3
warmup_epochs = 0.5
final_lr_fraction = 0.01
seed = 1

[checkpoint]
every_steps = 2000
