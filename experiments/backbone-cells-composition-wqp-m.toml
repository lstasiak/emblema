# The arm of the screen over the composition that adds the Water Quality Portal: the base recipe
# (backbone-cells-composition-m.toml) with every corpus read exactly as often and for as many
# epochs, so the stays and the telemetry are seen as much as in the base, and the portal's
# locations, one window of 14 years each, read once an epoch on top. It asks whether a large,
# irregular source of another domain, sampled between a grid and the stays, helps the stays.
# Two seeds: an arm is screened under two pretrainings.
name = "backbone-cells-composition-wqp-m"
tier = "M"
corpora = ["physionet2012", "physionet2019", "eicu_demo", "esa_ad_raw", "wqp"]
precision = "fp32"
dropout = 0.0
decoder_layers = 1

[fraction]
physionet2012 = 0.5
physionet2019 = 0.5

[passes]
physionet2012 = 6
physionet2019 = 2
eicu_demo = 10

[shape]
width = 64
heads = 16
layers = 2
feedforward_width = 128

[input]
bins = 6

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1

[objective]
kind = "huber"
huber_delta = 1.0
presence_weight = 1.0
count_weight = 0.5

[budget]
epochs = 17
batch_size = 32
accumulation_steps = 1
learning_rate = 1e-3
warmup_epochs = 0.5
final_lr_fraction = 0.01
seed = 1

[checkpoint]
every_steps = 2000
