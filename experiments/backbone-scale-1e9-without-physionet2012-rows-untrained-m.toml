# The control of backbone-scale-1e9-without-physionet2012-rows-m: the same fit of the rows of
# PhysioNet 2012's channels on an encoder the seed drew, nothing pretrained in it. Differs from
# the file it controls in the start alone.
name = "backbone-scale-1e9-without-physionet2012-rows-untrained-m"
tier = "M"
corpora = ["physionet2012"]
precision = "fp32"
dropout = 0.0
decoder_layers = 1
trained = "channel_rows"

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1

# Bounded at one standard deviation, as the point was read.
[objective]
kind = "huber"
huber_delta = 1.0

[budget]
epochs = 16
batch_size = 8
accumulation_steps = 8
learning_rate = 1e-2
warmup_epochs = 0
final_lr_fraction = 1.0
seed = 1

[checkpoint]
every_steps = 2000
