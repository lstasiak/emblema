# The control of backbone-scale-1e9-without-physionet2019-rows-m: the same fit of the rows of
# PhysioNet 2019's channels on an encoder the seed drew, nothing pretrained in it. What the rows
# alone carry to a task, against what the point's machinery carries once the rows are fitted;
# the diagnostic of docs/verification/zero-shot-pretext.md (2026-10-17) read this control at
# the channel-mean baseline on every kind of mask. Differs from the file it controls in the
# start alone.
name = "backbone-scale-1e9-without-physionet2019-rows-untrained-m"
tier = "M"
corpora = ["physionet2019"]
corpus_fraction = 0.25
precision = "fp32"
dropout = 0.0
decoder_layers = 1
trained = "channel_rows"

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1

# Bounded at one standard deviation, as the point was read.
[objective]
kind = "huber"
huber_delta = 1.0

[budget]
epochs = 6
batch_size = 16
accumulation_steps = 4
learning_rate = 1e-2
warmup_epochs = 0
final_lr_fraction = 1.0
seed = 1

[checkpoint]
every_steps = 2000
