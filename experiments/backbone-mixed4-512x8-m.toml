# The mixture of four in the larger shape: width 512, eight layers, 25.3M parameters, at
# 64 features a head and a feed-forward four times the width, as the tiers' shapes are stated.
# Everything else is the file of backbone-mixed4-m.toml, the rate included, so the pair differs
# in the shape alone. The rate stays at 1e-3: the fit of the best rate over model size in Kaplan
# et al. (2020) gives 1.1e-3 at 4.8M weights and 8.6e-4 at 25M, a gap well inside the factor of
# two over which their loss barely moves. The micro-batch is halved and a step accumulates four:
# the error is summed over hidden tokens and divided once per step, so a step of 32 windows
# descends the same gradient either way. Sixteen windows of 1,331 tokens, the longest satellite
# window, held 13.6 GiB in half precision with the attention scores materialised (MPS), too near
# a T4's 15; today's shape held 10.1 GiB at 1,900 tokens and fitted. The data falls well short
# of the twenty values a weight the catalogue's rule asks for, about 500M at this size, on
# purpose: this is the larger shape's point before the data grows.
name = "backbone-mixed4-512x8-m"
tier = "M"
corpora = ["cmapss", "skab", "esa_ad", "physionet2012"]
precision = "fp16"
dropout = 0.0
decoder_layers = 1

[shape]
width = 512
heads = 8
layers = 8
feedforward_width = 2048
time_frequencies = 12

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1

# Bounded at one standard deviation: the satellite corpus is learnt under that reading and not
# under the square, and the stays' channels have heavy tails too.
[objective]
kind = "huber"
huber_delta = 1.0

# Eight passes over every window, the epoch kept the one whose mean relative validation over the
# corpora is lowest: thirteen passes bought a better pretext loss and a worse task
# (backbone-mixed5-nosmd-m-13.toml). Eight windows a micro-batch, four to a step, for the
# reason above; a quarter of the first epoch warming up.
[budget]
epochs = 8
batch_size = 8
accumulation_steps = 4
learning_rate = 1e-3
warmup_epochs = 0.25
final_lr_fraction = 0.01
seed = 1

[checkpoint]
every_steps = 2000
