# The base recipe without the term for the cells' count: the hidden count is read at 0.96 from the
# schedule alone (docs/verification/cell-pretext.md), so the term may be a shortcut that costs the
# encoder nothing to learn and teaches it nothing. The presence and the values stay. Everything
# else is backbone-cells-clinical-m.toml.
name = "backbone-cells-clinical-nocount-m"
tier = "M"
corpora = ["physionet2012", "physionet2019"]
precision = "fp32"
dropout = 0.0
decoder_layers = 1

[fraction]
physionet2012 = 0.5

[passes]
physionet2012 = 5

[shape]
width = 64
heads = 16
layers = 2
feedforward_width = 128

[input]
bins = 6

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1

[objective]
kind = "huber"
huber_delta = 1.0
presence_weight = 1.0
count_weight = 0.0

[budget]
epochs = 19
batch_size = 32
accumulation_steps = 1
learning_rate = 1e-3
warmup_epochs = 0.5
final_lr_fraction = 0.01
seed = 1

[checkpoint]
every_steps = 2000
