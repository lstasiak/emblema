# The C-MAPSS backbone at the published tier's accelerator and precision, in the small shape.
#
# The saturation measurement found the small shape already at the objective's floor on this
# corpus, and the backbones read from one corpus are held at it until a larger shape is shown to
# earn something there (ADR-0008, dated section). The tier declares where and at what precision
# the run is made; the shape is the small tier's, stated field by field. Everything else is the
# file of the tier's own shape, to the step, so the pair differs in the shape alone.
name = "backbone-cmapss-m-small"
tier = "M"
corpus = "cmapss"
precision = "fp16"
dropout = 0.0
decoder_layers = 1

[shape]
width = 192
heads = 3
layers = 4
feedforward_width = 768
time_frequencies = 12

[masking]
channel_rate = 0.15
block_rate = 0.6
block_span = 0.5
token_rate = 0.1

[budget]
epochs = 4
batch_size = 32
accumulation_steps = 1
learning_rate = 1e-3
warmup_epochs = 0.25
final_lr_fraction = 0.01
seed = 1

[checkpoint]
every_steps = 500
