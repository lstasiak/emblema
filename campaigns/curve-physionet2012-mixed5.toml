# The label-efficiency curve on the intensive-care task under the mixed backbone.
#
# The claim's campaign: full fine-tuning against the network trained from nothing at 200 stays,
# the least gain 0.045 in area, the whole interval above zero and the floor. Beside them the
# other ways of using the backbone, the classical baselines and the patch model, as on the
# turbofans.
#
# Every candidate runs at the variant its selection chose at each budget, on the tuning side,
# under this backbone where the candidate reads one; the entries below are the selections'
# own choices, read again by the harness when the campaign is defined. Scored on the validation
# side, set B. Every cell of one budget runs on one kind of accelerator: the budgets are handed
# out by `campaign order --budget`, the cells of the general pool run on the host's processor.
#
# Defined with the worker's backbone set to the mixture of five,
# sha256:869ed545…; the design records it.
#
# Committed before the campaign runs, for the reason every campaign file is.

name = "curve-physionet2012-mixed5"
purpose = "tuning"
tier = "M"
measure = "auroc_shortfall"

[candidates]
competing = [
    "from_scratch",
    "frozen_probe",
    "frozen_ridge",
    "lora",
    "full_fine_tuning",
    "boosted_trees_per_channel",
    "boosted_trees_spectral",
    "boosted_trees_across_channels",
    "minirocket",
    "patch_transformer",
]
control = "from_scratch"
endpoint = "full_fine_tuning"

[budgets]
labels = ["50", "200", "1000", "all"]
endpoint = "200"
seeds = [1, 2, 3, 4, 5]

[rules]
# In area: the least gain and the floor's fixed part registered for the task on 2026-09-29.
minimum_absolute_reduction = 0.045
absolute_floor = 0.01
alpha = 0.05
correction = "holm"
# Nine contenders at four budgets, less the endpoint.
secondary_family_size = 35

[bootstrap]
resamples = 10000
seed = 1
level = 0.95

