# The label-efficiency curve on the turbofan task, repeated by the harness: five ways of using
# the backbone beside five methods that learn from labels alone, paired on the same validation
# engines, at four budgets under five seeds.
#
# What it is for: the first curve was drawn by a script, with every network under the mean of
# the window and one peak rate per arm swept at 200 labels; the diagnostics found the mean the
# largest identified loss and the control the arm it handicapped most
# (docs/verification/head-and-representation.md). This is the same question asked the way the
# protocol now asks it: every network pools by the tail of the window, every trained arm runs
# at the rate and tail a declared selection chose for it at each budget, the classical
# baselines at the variants their selections chose, the patch model as published, and the
# probe both under the schedule at its registered peak and solved in closed form. The endpoint is what it has always been: full
# fine-tuning against the arm from nothing at 200 labels, a tenth of the error, the whole
# interval above zero and the floor. The family grows with the candidates: nine contenders at
# four budgets less the endpoint.
#
# Every cell of one budget runs on one kind of accelerator: the budgets are handed out by
# `campaign order --budget`, the cells of the general pool run on the host's processor.
#
# Committed before the campaign runs, for the reason every campaign file is.

name = "curve-fd001"
purpose = "tuning"
tier = "M"

[candidates]
competing = [
    "from_scratch",
    "frozen_probe@learning_rate=0.03,pooling=tail,tail_share=0.2",
    "frozen_ridge@pooling=tail,tail_share=0.2",
    "lora",
    "full_fine_tuning",
    "boosted_trees_per_channel",
    "boosted_trees_spectral",
    "boosted_trees_across_channels",
    "minirocket",
    "patch_transformer",
]
control = "from_scratch"
endpoint = "full_fine_tuning"

[budgets]
labels = ["50", "200", "1000", "all"]
endpoint = "200"
seeds = [1, 2, 3, 4, 5]

[rules]
minimum_relative_reduction = 0.1
floor_share = 0.02
alpha = 0.05
correction = "holm"
# Nine contenders at four budgets, less the endpoint.
secondary_family_size = 35

[bootstrap]
resamples = 10000
seed = 1
level = 0.95

# The variant each tuned candidate runs at each budget, as the selection named beside it chose
# it by its rule; the comparison is refused if any of these is not what that selection, read
# again, chooses. The three trained arms' entries are filled in from
# campaigns/selection-scratch-fd001.toml, campaigns/selection-fine-tuning-fd001.toml and
# campaigns/selection-lora-fd001.toml, and at 50 labels from the two selections one step beyond
# the edge those chose.

