# The label-efficiency curve on the intensive-care task under the backbone of the stays alone.
#
# Its own family, no claim: the four ways of using the backbone against the network trained from
# nothing, whose variants were selected in this backbone's run. The classical baselines and the
# patch model read no backbone and run in the mixed backbone's campaign only; the two backbones
# are set side by side as a declared diagnostic.
#
# Every candidate runs at the variant its selection chose at each budget, on the tuning side,
# under this backbone where the candidate reads one; the entries below are the selections'
# own choices, read again by the harness when the campaign is defined. Scored on the validation
# side, set B. Every cell of one budget runs on one kind of accelerator: the budgets are handed
# out by `campaign order --budget`, the cells of the general pool run on the host's processor.
#
# Defined with the worker's backbone set to the stays alone,
# sha256:c5878c03…; the design records it.
#
# Committed before the campaign runs, for the reason every campaign file is.

name = "curve-physionet2012-stays"
purpose = "tuning"
tier = "M"
measure = "auroc_shortfall"

[candidates]
competing = [
    "from_scratch",
    "frozen_probe",
    "frozen_ridge",
    "lora",
    "full_fine_tuning",
]
control = "from_scratch"
endpoint = "full_fine_tuning"

[budgets]
labels = ["50", "200", "1000", "all"]
endpoint = "200"
seeds = [1, 2, 3, 4, 5]

[rules]
# In area: the least gain and the floor's fixed part registered for the task on 2026-09-29.
minimum_absolute_reduction = 0.045
absolute_floor = 0.01
alpha = 0.05
correction = "holm"
# Four contenders at four budgets, less the endpoint.
secondary_family_size = 15

[bootstrap]
resamples = 10000
seed = 1
level = 0.95

[[tuned]]
candidate = "from_scratch"
budget = "50"
variant = "from_scratch"
