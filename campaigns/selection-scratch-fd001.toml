# Which setting the arm trained from nothing runs at, at every budget of the repeated curve,
# chosen on held-out tuning engines before the curve runs.
#
# What it is for: the pilot (campaigns/selection-networks-fd001.toml) found this arm short of
# rate rather than of steps at 200 labels, and chose three times the registered peak, the
# largest rate its grid held. The repeat of the curve stands at four budgets, and a rate chosen
# where labels are scarce is not the rate for where they are not; so the knobs are turned again
# at every budget, around the pilot's choice, with the grid reaching a decade above the peak
# and the longer tail the pilot found within reach: the rate a third and three times the
# pilot's, and the tail's share at half the window. One knob at a time, so the setting the rule
# reads around is unambiguous.
#
# One arm per selection campaign, because an order hands out every outstanding cell of a pool
# and a campaign is what one accelerator runs whole.

name = "selection-scratch-fd001"
purpose = "selection"
tier = "M"

[selection]
# One tuning engine in five held out in every repeat: sixteen of seventy-nine to score on.
one_in = 5

[candidates]
competing = [
    "from_scratch@learning_rate=0.003,pooling=tail,tail_share=0.2",
    "from_scratch@learning_rate=0.001,pooling=tail,tail_share=0.2",
    "from_scratch@learning_rate=0.01,pooling=tail,tail_share=0.2",
    "from_scratch@learning_rate=0.003,pooling=tail,tail_share=0.5",
]
# A selection answers which variant, not whether a candidate beats another; the control and the
# endpoint are named because every campaign names them, and read nothing here.
control = "from_scratch@learning_rate=0.003,pooling=tail,tail_share=0.2"
endpoint = "from_scratch@learning_rate=0.01,pooling=tail,tail_share=0.2"

[budgets]
labels = ["50", "200", "1000", "all"]
endpoint = "200"
seeds = [1, 2, 3]

[rules]
minimum_relative_reduction = 0.1
floor_share = 0.02
alpha = 0.05
secondary_family_size = 15

[bootstrap]
resamples = 10000
seed = 1
level = 0.95
