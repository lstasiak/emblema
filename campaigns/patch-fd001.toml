# The patch model beside the control arm and the strongest baseline, over the turbofans.
#
# What it is for: the control arm measures a set encoder trained from nothing; a patch model
# trained from nothing on the grid measures what a different, widely used architecture does with
# the same labels, under the same compute budget and the same schedule. The trees stand beside
# them at the variants their selection chose, so the three are paired on the same engines.
#
# Committed before the campaign runs, for the reason every campaign file is.

name = "patch-fd001"
purpose = "tuning"
tier = "S"

[candidates]
competing = [
    "from_scratch",
    "patch_transformer",
    "boosted_trees_per_channel",
]
control = "from_scratch"
endpoint = "patch_transformer"

[budgets]
labels = ["50", "200"]
endpoint = "200"
seeds = [1, 2, 3]

[rules]
minimum_relative_reduction = 0.1
floor_share = 0.02
alpha = 0.05
# Two contenders at two budgets, less the endpoint itself.
secondary_family_size = 3

[bootstrap]
resamples = 10000
seed = 1
level = 0.95

# The variant the trees run at each budget, as the selection declared in
# campaigns/selection-classical-fd001.toml chose it by its rule.
[[tuned]]
candidate = "boosted_trees_per_channel"
budget = "50"
variant = "boosted_trees_per_channel"
selected_by = "3856e705-95c9-4a8b-bbf8-bc1fb0187f0b"

[[tuned]]
candidate = "boosted_trees_per_channel"
budget = "200"
variant = "boosted_trees_per_channel@max_depth=3"
selected_by = "3856e705-95c9-4a8b-bbf8-bc1fb0187f0b"
