# The heads fitted to their optimum over the intensive-care task, against the trees, to see the
# probe and MiniRocket answer outcomes by penalised likelihood end to end after the smoke of the
# whole campaign put the calibrated probe below chance at fifty stays.
#
# What it is for: the harness, not the question. Same task, same two-epoch backbone at the small
# tier and one seed as that smoke; the trees are the control only because they run in seconds and
# the heads under test are not networks. Nothing read here is cited.
#
# Committed before the campaign runs, for the reason every campaign file is.

name = "smoke-heads-physionet2012"
purpose = "tuning"
tier = "S"
measure = "auroc_shortfall"

[candidates]
competing = [
    "boosted_trees_per_channel",
    "frozen_ridge",
    "minirocket",
]
control = "boosted_trees_per_channel"
endpoint = "frozen_ridge"

[budgets]
labels = ["50", "all"]
endpoint = "50"
seeds = [1]

[rules]
minimum_absolute_reduction = 0.02
absolute_floor = 0.01
alpha = 0.05
# Two contenders at two budgets, less the endpoint itself.
secondary_family_size = 3

[bootstrap]
resamples = 1000
seed = 1
level = 0.95
