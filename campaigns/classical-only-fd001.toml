# A grid with no network in it at all, over the turbofans.
#
# What it is for: the Evaluation context is meant to compare a network against methods that learn
# from labels alone, and nothing about that comparison may depend on the context that trains
# networks. A campaign made only of these runs end to end where the training stack is not
# installed, which is the only way to show it rather than assert it.
#
# Three grow trees and differ in what a window is turned into: statistics per channel, the
# spectrum per channel, or both summarised across channels — the only reading whose width is the
# same whatever the layout, which is what lets a fit take in a second corpus's labels. The fourth
# lays the window on a grid and convolves it. The control is the reading bound to one corpus, so
# every other candidate is read against it.

name = "classical-only-fd001"
purpose = "tuning"
tier = "S"

[candidates]
competing = [
    "boosted_trees_per_channel",
    "boosted_trees_spectral",
    "boosted_trees_across_channels",
    "minirocket",
]
control = "boosted_trees_per_channel"
endpoint = "boosted_trees_across_channels"

[budgets]
labels = ["50", "200"]
endpoint = "200"
seeds = [1, 2]

[rules]
minimum_relative_reduction = 0.1
floor_share = 0.02
alpha = 0.05
secondary_family_size = 8

[bootstrap]
resamples = 10000
seed = 1
level = 0.95

# The variant each classical baseline runs at each budget, as the selection declared in
# campaigns/selection-classical-fd001.toml chose it by its rule; the comparison is refused if any
# of these is not what that selection, read again, chooses.
[[tuned]]
candidate = "boosted_trees_per_channel"
budget = "50"
variant = "boosted_trees_per_channel"
selected_by = "3856e705-95c9-4a8b-bbf8-bc1fb0187f0b"

[[tuned]]
candidate = "boosted_trees_per_channel"
budget = "200"
variant = "boosted_trees_per_channel@max_depth=3"
