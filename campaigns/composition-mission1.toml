# The first mission's events read under a backbone pretrained over the composition, whose first
# half of the mission's months it read without a label: the leg's endpoint. The encoder's states
# against the same encoder at its initialisation, and the detector scored by the error of the
# backbone's own pretext where its masks hide a window's cells (ADR-0068), each read against the
# other windows of its own unit, as the mission is read since its alarm flooded on drift.
#
# The detectors that read no weights (the summaries, the counts of readings, the ridge per channel
# and the line between visible bins) are fitted once for the task in
# campaigns/composition-mission1-bars.toml.
#
# Run once under each backbone the screen reads; committed before the campaign runs.
name = "composition-mission1"
purpose = "tuning"
tier = "M"
measure = "pr_auc_shortfall"

[candidates]
competing = [
    "untrained_knn@reference=unit",
    "frozen_knn@reference=unit",
    "pretext_error@reference=unit",
]
control = "untrained_knn@reference=unit"
endpoint = "frozen_knn@reference=unit"

[budgets]
labels = ["all"]
endpoint = "all"
seeds = [1, 2, 3]

[rules]
minimum_absolute_reduction = 0.05
absolute_floor = 0.01
alpha = 0.05
secondary_family_size = 1

[bootstrap]
resamples = 10000
seed = 1
level = 0.95
