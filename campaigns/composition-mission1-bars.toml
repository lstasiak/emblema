# The first mission's detectors that read no backbone's weights, fitted once for the screen over
# the composition: the summaries per channel and the counts of readings, and the two answers the
# pretext's error is compared with (ADR-0068), a ridge per channel over the same visible cells and
# each channel's line between its visible bins. Those two hide what the backbone's masks hide, and
# every backbone of the composition draws its masks by one rule, so one backbone's masks stand for
# all. Each read against the other windows of its own unit; the counts against the fitting side
# too.
#
# Run once, under the first backbone of the screen; committed before the campaign runs.
name = "composition-mission1-bars"
purpose = "tuning"
tier = "M"
measure = "pr_auc_shortfall"

[candidates]
competing = [
    "summaries_knn@reference=unit",
    "linear_answer_error@reference=unit",
    "interpolation_error@reference=unit",
    "counts_knn@reference=unit",
    "counts_knn",
]
control = "summaries_knn@reference=unit"
endpoint = "linear_answer_error@reference=unit"

[budgets]
labels = ["all"]
endpoint = "all"
seeds = [1, 2, 3]

[rules]
minimum_absolute_reduction = 0.05
absolute_floor = 0.01
alpha = 0.05
secondary_family_size = 3

[bootstrap]
resamples = 10000
seed = 1
level = 0.95
