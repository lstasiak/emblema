# Which setting the low-rank arm runs at, at every budget of the repeated curve, chosen on
# held-out tuning engines before the curve runs.
#
# What it is for: the low-rank arm was the best pretrained arm at 50 and at 200 labels on the
# first curve, under the mean pooling and a peak of 1e-4 swept at 200; it has not run under the
# tail at all. A repeat that tuned the control per budget and left this arm at a peak swept once
# under another head would hand the pretrained side the handicap the diagnostics just took off
# the control. So its rate, a third and three times the registered peak, and a longer tail are
# turned one at a time around the peak in force under the tail of 20 %, at every budget. One
# arm per campaign, so that one accelerator runs it whole.

name = "selection-lora-fd001"
purpose = "selection"
tier = "M"

[selection]
one_in = 5

[candidates]
competing = [
    "lora@learning_rate=0.0001,pooling=tail,tail_share=0.2",
    "lora@learning_rate=0.0000333,pooling=tail,tail_share=0.2",
    "lora@learning_rate=0.0003,pooling=tail,tail_share=0.2",
    "lora@learning_rate=0.0001,pooling=tail,tail_share=0.5",
]
control = "lora@learning_rate=0.0001,pooling=tail,tail_share=0.2"
endpoint = "lora@learning_rate=0.0003,pooling=tail,tail_share=0.2"

[budgets]
labels = ["50", "200", "1000", "all"]
endpoint = "200"
seeds = [1, 2, 3]

[rules]
minimum_relative_reduction = 0.1
floor_share = 0.02
alpha = 0.05
secondary_family_size = 15

[bootstrap]
resamples = 10000
seed = 1
level = 0.95
