# A detection campaign over a task whose units drift away from its fitting side, named at the
# command line: the satellite mission read month by month and the testbed read experiment by
# experiment, where an alarm set on the fitting side flagged nearly every later window.
#
# The detectors of detection-events, each distance read against the other windows of its own
# unit before the alarm (the median of the unit's distances taken off, over their spread), and
# the alarm set over the fitting windows read so within theirs: whether an event stands out
# within its month or experiment, with no label spent. Beside them the detector over the counts
# of readings alone, read both ways: what the sampling tells without a value. A task whose
# units hold one window each has nothing to read a window against, so this file is not for
# the fragments.
#
# Run once under each backbone the task is read under; committed before the campaign runs.

name = "detection-events-per-unit"
purpose = "tuning"
tier = "M"
measure = "pr_auc_shortfall"

[candidates]
competing = [
    "untrained_knn@reference=unit",
    "frozen_knn@reference=unit",
    "summaries_knn@reference=unit",
    "counts_knn@reference=unit",
    "counts_knn",
]
control = "untrained_knn@reference=unit"
endpoint = "frozen_knn@reference=unit"

[budgets]
labels = ["all"]
endpoint = "all"
seeds = [1, 2, 3]

[rules]
# As registered for these tasks (docs/verification/anomaly-tasks.md, 2026-10-27); the 3
# comparisons beside the endpoint form the family the secondary ones are corrected over.
minimum_absolute_reduction = 0.05
absolute_floor = 0.01
alpha = 0.05
secondary_family_size = 3

[bootstrap]
resamples = 10000
seed = 1
level = 0.95
